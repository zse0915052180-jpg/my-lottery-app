<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- ... (請保留您原有的 CSS 樣式，並確認已加入底部導覽列 CSS) ... -->
    <style>
        /* [這裡請放入您原本的完整 CSS] */
        /* ... 務必包含我上次提供的 .footer-nav 樣式 ... */
    </style>
</head>
<body>
    <div class="container">
        
        <!-- 【功能】頁面內容區域 (這裡放置您原本的看板與計算畫面) -->
        <div id="tabContent_func">
            <!-- 從 <div class="header-area"> 到 </div> (包含計算器的那個區塊) -->
            <!-- 這是您原本的功能畫面核心內容 -->
            <!-- ... 請將您原有的 HTML 內容全部貼在這裡 ... -->
        </div>

        <!-- 【紀錄】頁面內容區域 -->
        <div id="tabContent_record" style="display: none;">
            <div class="record-summary-box">
                <!-- ... (記帳統計面板內容) ... -->
            </div>
            <button class="add-record-btn" onclick="openAddRecordModal()">+ 新增紀錄</button>
            <div class="record-list" id="recordList"></div>
        </div>
    </div>

    <!-- 底部導覽列 (固定在最下方) -->
    <div class="footer-nav">
        <div id="footerNavFunc" class="footer-nav-item active" onclick="switchFooterTab('func')">⚙️ 功能</div>
        <div id="footerNavRecord" class="footer-nav-item" onclick="switchFooterTab('record')">📋 紀錄</div>
    </div>

    <!-- ... (您的 Modal 與 Script 區塊) ... -->
    <script>
        // 確保切換邏輯正確
        function switchFooterTab(tab) {
            const funcArea = document.getElementById('tabContent_func');
            const recordArea = document.getElementById('tabContent_record');
            
            if (tab === 'func') {
                funcArea.style.display = 'block';
                recordArea.style.display = 'none';
                document.getElementById('footerNavFunc').classList.add('active');
                document.getElementById('footerNavRecord').classList.remove('active');
            } else {
                funcArea.style.display = 'none';
                recordArea.style.display = 'block';
                document.getElementById('footerNavFunc').classList.remove('active');
                document.getElementById('footerNavRecord').classList.add('active');
            }
        }
        
        // ... (其他原有 JS) ...
    </script>
</body>
</html>
